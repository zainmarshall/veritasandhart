heading: "Truth & Heart"
paragraphs:
  - "Veritas means truth. Hart means heart, empathy, courage. The ampersand binds strategy and humanity together, the two things that define how this firm operates."
  - "Veritas & Hart was founded by Ummara (Mara) Marshall. Mara brings pattern recognition built across Amazon, Marriott International, investment banking, and a Harvard economics education, not as a resume line, but as the lens through which she reads an organization and identifies what actually needs to happen."
  - "This is a firm of one by design. The senior person who scopes the work is the same person who does the work. Every engagement gets direct, experienced attention from start to finish."
credentials:
  - "Harvard Economics"
  - "PMP Certified"
  - "Lean Six Sigma Black Belt"
